<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cozinha">
<meta name="theme-color" content="#0a1a0a">
<title>Pavanelo</title>
<style>:root{--green:#4ade80;--gold:#fbbf24;--bg:#0a1a0a;--text:#f0f0f0;--muted:#64748b;--red:#f87171}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:480px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom,20px)}
.header{background:linear-gradient(180deg,#0d220d,var(--bg));padding:52px 20px 16px;border-bottom:1px solid rgba(255,255,255,0.08);position:sticky;top:0;z-index:10;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.header-top{display:flex;justify-content:space-between;align-items:center}
.header-logo img{height:32px}
.dia{font-size:13px;color:var(--gold);font-weight:600;text-align:right}
.hora{font-size:12px;color:var(--muted);text-align:right}
.cpf-header{margin-top:10px}
.cpf-pct{font-size:36px;font-weight:700;color:var(--green);letter-spacing:-1px}
.cpf-sub{font-size:12px;color:var(--muted);margin-top:2px}
.cpf-bar-wrap{height:8px;background:rgba(255,255,255,0.08);border-radius:6px;overflow:hidden;margin-top:8px}
.cpf-bar{height:100%;background:linear-gradient(90deg,var(--green),var(--gold));border-radius:6px;transition:width 0.5s}
.section{padding:16px 16px 0}
.section-title{font-size:11px;color:var(--gold);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.section-title::before{content:"";width:6px;height:6px;background:var(--green);border-radius:50%}
.card{background:#0a1a0a;border:1px solid rgba(255,255,255,0.1);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.vend-item{padding:10px 0;box-shadow:0 1px 0 rgba(255,255,255,0.06)}
.vend-item:last-child{box-shadow:none}
.vend-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.vend-nome{font-size:14px;font-weight:600}
.vend-cpf{font-size:14px;font-weight:700;color:var(--green)}
.vend-bar-wrap{height:4px;background:rgba(255,255,255,0.08);border-radius:3px;overflow:hidden;margin-bottom:4px}
.vend-bar{height:100%;background:linear-gradient(90deg,var(--green),var(--gold));border-radius:3px;transition:width 0.5s}
.vend-sub{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.kpi-card{background:#0a1a0a;border:1px solid rgba(255,255,255,0.1);border-radius:14px;padding:14px;text-align:center}
.kpi-val{font-size:26px;font-weight:700;color:var(--green)}
.kpi-label{font-size:11px;color:var(--muted);margin-top:5px;text-transform:uppercase;letter-spacing:0.5px}
.meta-item{padding:10px 0;box-shadow:0 1px 0 rgba(255,255,255,0.06)}
.meta-item:last-child{box-shadow:none}
.meta-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;font-size:14px}
.meta-bar-wrap{height:5px;background:rgba(255,255,255,0.08);border-radius:3px;overflow:hidden;margin-bottom:3px}
.meta-bar{height:100%;background:linear-gradient(90deg,var(--green),var(--gold));border-radius:3px;transition:width 0.5s}
.meta-val{font-size:11px;color:var(--muted)}
.badge{padding:2px 8px;border-radius:10px;font-size:11px;font-weight:bold}
.badge.ok{background:#16a34a;color:white}
.badge.falta{background:rgba(255,255,255,0.08);color:var(--muted);font-size:10px}
.meta-aviso{text-align:center;padding:24px 10px;color:var(--muted);font-size:13px;line-height:1.7}
.meta-aviso strong{color:var(--gold);font-size:16px;display:block;margin-bottom:6px}
.footer-campanha{font-size:12px;color:var(--muted);text-align:center;padding:0 16px 10px;line-height:1.6}
.footer-campanha span{color:var(--gold);font-weight:600}
.footer{text-align:center;padding:16px;font-size:11px;color:var(--muted)}
.loading{text-align:center;padding:60px 20px;color:var(--muted)}
.spin{font-size:32px;display:block;animation:spin 1s linear infinite;margin-bottom:12px}
@keyframes spin{to{transform:rotate(360deg)}}
.btn-atualizar{display:block;margin:0 16px 16px;padding:12px;background:rgba(74,222,128,0.1);border:1px solid rgba(74,222,128,0.3);border-radius:10px;color:var(--green);font-size:13px;text-align:center;cursor:pointer}
.btn-atualizar:active{background:rgba(74,222,128,0.2)}
.vazio{font-size:13px;color:var(--muted);text-align:center;padding:16px 0}
.erro{color:var(--red);text-align:center;padding:30px 20px;font-size:13px;line-height:1.6}</style>
</head>

<script>
const SHEET_ID = '1DJvoPx8c_BR4Sb8Uy4X7ntAgtLvYSGAgfNC6_f0Gy8U';
const ABAS = ['Ranking Diario','Acumulado Mensal','Meta Sextas','Resumo Dia'];

function sheetUrl(aba) {
  return 'https://docs.google.com/spreadsheets/d/' + SHEET_ID +
         '/gviz/tq?tqx=out:csv&sheet=' + encodeURIComponent(aba);
}

function proxyUrl(url) {
  return 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url);
}

function parseCSV(text) {
  const rows = [];
  for (const line of text.trim().split('\n')) {
    if (!line.trim()) continue;
    const cols = [];
    let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      if (line[i] === '"') { inQ = !inQ; continue; }
      if (line[i] === ',' && !inQ) { cols.push(cur.trim()); cur = ''; continue; }
      cur += line[i];
    }
    cols.push(cur.trim());
    rows.push(cols);
  }
  return rows;
}

async function fetchAba(aba) {
  const url = proxyUrl(sheetUrl(aba));
  const r = await fetch(url);
  if (!r.ok) throw new Error('Erro HTTP ' + r.status + ' em ' + aba);
  return parseCSV(await r.text());
}

function parseBrl(s) {
  if (!s) return 0;
  return parseFloat(String(s).replace(/R\$/g,'').replace(/\s/g,'').replace(/\./g,'').replace(',','.')) || 0;
}

function fmtBrl(v) {
  return 'R$ ' + v.toFixed(2).replace('.',',').replace(/\B(?=(\d{3})+(?!\d))/g,'.');
}

async function carregar() {
  document.getElementById('conteudo').innerHTML = '<div class="loading"><span class="spin">&#127807;</span>Carregando...</div>';
  const agora = new Date();
  const diasNome = ['Domingo','Segunda','Terca','Quarta','Quinta','Sexta','Sabado'];
  document.getElementById('dia').textContent = diasNome[agora.getDay()] + ', ' + agora.toLocaleDateString('pt-BR');
  document.getElementById('hora').textContent = 'Atualizado as ' + agora.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});

  try {
    const [rowsRank, rowsMes, rowsMeta, rowsRes] = await Promise.all(ABAS.map(fetchAba));

    // RESUMO CPF
    let pctCpf = 0, totalVnd = 0, totalCpf = 0;
    for (const row of rowsRes) {
      if (!row[0]) continue;
      if (row[0].includes('% de vendas com CPF (dia)')) pctCpf = parseBrl(row[1]);
      if (row[0].includes('Total de vendas do dia')) totalVnd = parseInt(parseBrl(row[1])) || 0;
      if (row[0].includes('Vendas com CPF (qtd)') && !row[0].includes('mes') && !row[0].includes('s')) totalCpf = parseInt(parseBrl(row[1])) || 0;
    }
    document.getElementById('cpf-pct').textContent = pctCpf.toFixed(0) + '%';
    document.getElementById('cpf-sub').textContent = totalCpf + '/' + totalVnd + ' vendas com CPF hoje';
    document.getElementById('cpf-bar').style.width = Math.min(pctCpf,100) + '%';

    // RANKING DIARIO
    const medals = ['&#127949;','&#129352;','&#129353;'];
    const ehSexta = agora.getDay() === 5;
    const ranking = rowsRank.filter(r => r[0] && r[0] !== 'Pos' && /^\d+$/.test(r[0]))
                             .map(r => ({nome:r[1],qtd:parseInt(r[2])||0,cpf:parseInt(r[3])||0,pct:r[4]||'0%',sexta:r[5]||''}));
    const maxCpf = Math.max(...ranking.map(r=>r.cpf), 1);

    let rankHtml = ranking.map((r,i) => {
      const pBar = Math.min(r.cpf/maxCpf*100,100).toFixed(1);
      const med = i < 3 ? medals[i]+' ' : '';
      let sTag = '';
      if (ehSexta && r.sexta) {
        const v = parseBrl(r.sexta);
        sTag = v >= 5000
          ? '<span style="color:var(--green);font-size:11px">Meta!</span>'
          : '<span style="color:var(--muted);font-size:11px">R$ ' + Math.round(v).toLocaleString('pt-BR') + '</span>';
      }
      return '<div class="vend-item"><div class="vend-top"><span class="vend-nome">' + med + r.nome + '</span><span class="vend-cpf">' + r.cpf + ' CPFs</span></div>' +
             '<div class="vend-bar-wrap"><div class="vend-bar" style="width:' + pBar + '%"></div></div>' +
             '<div class="vend-sub"><span>' + r.qtd + ' vendas &middot; ' + r.pct + '</span>' + sTag + '</div></div>';
    }).join('') || '<div class="vazio">Sem dados de hoje ainda</div>';

    // RANKING MENSAL
    const mensal = rowsMes.filter(r => r[0] && r[0] !== 'Pos' && /^\d+$/.test(r[0]))
                          .map(r => ({nome:r[1],qtd:parseInt(r[2])||0,cpf:parseInt(r[3])||0,pct:r[4]||'0%'}));
    const maxMes = Math.max(...mensal.map(r=>r.cpf), 1);
    let mesHtml = mensal.map((r,i) => {
      const pBar = Math.min(r.cpf/maxMes*100,100).toFixed(1);
      const med = i < 3 ? medals[i]+' ' : '';
      return '<div class="vend-item"><div class="vend-top"><span class="vend-nome">' + med + r.nome + '</span><span class="vend-cpf">' + r.cpf + ' CPFs</span></div>' +
             '<div class="vend-bar-wrap"><div class="vend-bar" style="width:' + pBar + '%"></div></div>' +
             '<div class="vend-sub"><span>' + r.qtd + ' vendas &middot; ' + r.pct + '</span></div></div>';
    }).join('') || '<div class="vazio">Sem dados ainda</div>';

    // META SEXTA
    const diasFull = ['Domingo','Segunda','Terca','Quarta','Quinta','Sexta','Sabado'];
    const metaRows = rowsMeta.filter(r => r[0] && r[0] !== 'Vendedor' && r[0] !== 'Pos');
    let metaHtml = '';
    if (!ehSexta || !metaRows.length || metaRows[0][0] === '-' || metaRows[0][0] === '\u2014') {
      const falta = agora.getDay() === 5 ? 7 : (5 - agora.getDay() + 7) % 7 || 7;
      metaHtml = '<div class="meta-aviso"><strong>Meta vale apenas nas SEXTAS</strong>' +
                 'Hoje e ' + diasFull[agora.getDay()] + '.<br>' +
                 'Proxima sexta em <span style="color:var(--green);font-weight:bold">' + falta + ' dia(s)</span>.<br><br>' +
                 'Meta: <span style="color:var(--gold);font-weight:bold">R$ 5.000,00</span><br>Premio: <span style="color:var(--gold)">R$40 ou vale-lanche</span></div>';
    } else {
      metaHtml = metaRows.map(r => {
        if (!r[0] || r[0] === '\u2014' || r[0] === '-') return '';
        const nome = r[0], valor = parseBrl(r[1]), meta = parseBrl(r[2]) || 5000;
        const bateu = r[3] && r[3].includes('BATEU');
        const pBar = Math.min(valor/meta*100, 100).toFixed(1);
        const badge = bateu ? '<span class="badge ok">BATEU!</span>' : '<span class="badge falta">' + r[3] + '</span>';
        return '<div class="meta-item"><div class="meta-top"><span>' + nome + '</span>' + badge + '</div>' +
               '<div class="meta-bar-wrap"><div class="meta-bar" style="width:' + pBar + '%"></div></div>' +
               '<div class="meta-val">' + fmtBrl(valor) + ' / ' + fmtBrl(meta) + '</div></div>';
      }).join('') || '<div class="vazio">Sem dados</div>';
    }

    let html = '';
    html += '<div class="section"><div class="kpi-grid">' +
            '<div class="kpi-card"><div class="kpi-val">' + totalVnd + '</div><div class="kpi-label">Vendas hoje</div></div>' +
            '<div class="kpi-card"><div class="kpi-val">' + totalCpf + '</div><div class="kpi-label">com CPF</div></div>' +
            '</div></div>';
    html += '<div class="section"><div class="section-title">Ranking do Dia &mdash; CPF</div><div class="card">' + rankHtml + '</div></div>';
    html += '<div class="section"><div class="section-title">Ranking do Mes &mdash; CPF</div><div class="card">' + mesHtml + '</div></div>';
    html += '<div class="section"><div class="section-title">Meta de Sexta &mdash; R$ 5.000</div><div class="card">' + metaHtml + '</div></div>';
    document.getElementById('conteudo').innerHTML = html;

  } catch(e) {
    document.getElementById('conteudo').innerHTML = '<div class="erro">Erro: ' + e.message + '<br><br>Verifique a conexao e tente novamente.</div>';
    console.error(e);
  }
}

carregar();
setInterval(carregar, 5*60*1000);
setInterval(function(){
  document.getElementById('hora').textContent = 'Atualizado as ' + new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}, 60000);
</script>
</body>
</html>
