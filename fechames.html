<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pavanelo | Fecha-Mês</title>
  <style>
    :root{--bg:#061b0b;--card:rgba(18,56,25,.72);--line:rgba(118,197,138,.24);
          --text:#f4fff5;--muted:#a8c4b4;--green:#43e681;--yellow:#ffc928;
          --blue:#5aa2ff;--red:#ff6060;--orange:#ff9940}
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:radial-gradient(circle at 22% 12%,rgba(67,230,129,.12),transparent 34%),
          linear-gradient(135deg,var(--bg) 0%,#071506 52%,#09210e 100%);
          color:var(--text);font-family:Arial,Helvetica,sans-serif;min-height:100vh}
    header{padding:18px 22px 0;border-bottom:1px solid var(--line);background:rgba(6,27,11,.92)}
    .brand{color:var(--yellow);font-size:11px;font-weight:800;letter-spacing:3px;text-transform:uppercase;margin-bottom:5px}
    h1{font-size:clamp(20px,3vw,34px);line-height:1;margin-bottom:3px}
    .meta{color:var(--muted);font-size:12px;margin-bottom:10px}
    /* seletor de meses */
    .mes-row{display:flex;align-items:center;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:0}
    .mes-lbl{color:var(--muted);font-size:11px;white-space:nowrap;font-weight:700;text-transform:uppercase;letter-spacing:1px}
    .mes-btn{border:1px solid var(--line);background:rgba(18,56,25,.5);color:var(--muted);
              padding:6px 12px;border-radius:20px;font-weight:700;cursor:pointer;font-size:12px;white-space:nowrap}
    .mes-btn.active{color:#061b0b;background:var(--yellow);border-color:var(--yellow)}
    /* sub-abas */
    .tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 0 0;}
    .tab{border:1px solid var(--line);background:rgba(18,56,25,.64);color:var(--muted);
          padding:8px 13px;border-radius:8px 8px 0 0;font-weight:800;cursor:pointer;
          font-size:12px;white-space:nowrap;border-bottom:none}
    .tab.active{color:#061b0b;background:var(--green);border-color:var(--green)}
    .tab.disabled{opacity:.3;pointer-events:none}
    /* panels */
    .panel{display:none;padding:20px}
    .panel.active{display:block}
    /* kpis */
    .kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:20px}
    .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
    .kpi-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:5px}
    .kpi-val{font-size:22px;font-weight:900;line-height:1}
    .kpi-sub{font-size:11px;color:var(--muted);margin-top:3px}
    .kpi.amarelo .kpi-val{color:var(--yellow)}
    .kpi.verde   .kpi-val{color:var(--green)}
    .kpi.azul    .kpi-val{color:var(--blue)}
    .kpi.laranja .kpi-val{color:var(--orange)}
    /* parcial badge */
    .parcial-badge{background:rgba(255,153,64,.18);border:1px solid rgba(255,153,64,.4);
                    color:var(--orange);border-radius:8px;padding:8px 14px;font-size:12px;
                    margin-bottom:14px;display:none}
    .parcial-badge.show{display:block}
    /* grid 2 col */
    .g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    /* card */
    .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}
    .card h3{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px}
    /* barras diarias */
    .bars{display:flex;align-items:flex-end;gap:3px;height:170px;overflow-x:auto;padding-bottom:4px}
    .bar-wrap{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-width:20px;flex:1;max-width:36px;height:100%}
    .bar-stack{width:100%;border-radius:3px 3px 0 0;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
    .bar-prazo{background:var(--blue);opacity:.8}
    .bar-vista{background:var(--green);opacity:.8}
    .bar-total{background:var(--yellow);opacity:.85}
    .bar-label{font-size:9px;color:var(--muted);margin-top:2px}
    /* progress bars */
    .pbar-wrap{margin-bottom:8px}
    .pbar-label{display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px}
    .pbar{height:13px;background:rgba(118,197,138,.15);border-radius:7px;overflow:hidden}
    .pbar-fill{height:100%;border-radius:7px}
    /* table */
    table{width:100%;border-collapse:collapse;font-size:12px}
    th{color:var(--muted);text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);font-size:10px;text-transform:uppercase}
    td{padding:6px 8px;border-bottom:1px solid rgba(118,197,138,.1)}
    tr:hover td{background:rgba(67,230,129,.05)}
    .num{text-align:right;font-variant-numeric:tabular-nums}
    /* pizza */
    .pizza-row{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
    .legend{display:flex;flex-direction:column;gap:8px}
    .leg-item{display:flex;align-items:center;gap:8px;font-size:12px}
    .leg-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0}
    /* fake */
    .fake-badge{background:rgba(255,96,96,.15);border:1px solid rgba(255,96,96,.35);
                 color:var(--red);border-radius:8px;padding:8px 14px;font-size:12px;margin-bottom:12px}
    @media(max-width:700px){.g2{grid-template-columns:1fr}.bars{height:100px}}
  </style>
</head>

const brl = v => "R$ " + (+v).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const pct = (a,b) => b ? (100*a/b).toFixed(1)+"%" : "—";

// ── Tabs ─────────────────────────────────────────────────────────────────────
let tabAtual = "geral";
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => setTab(t.dataset.tab)));
function setTab(id) {
  tabAtual = id;
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.tab===id));
  document.querySelectorAll(".panel").forEach(p => p.classList.toggle("active", p.id===id));
}

// ── Mes selector ─────────────────────────────────────────────────────────────
const mesBtns = document.querySelectorAll(".mes-btn");
mesBtns.forEach(b => b.addEventListener("click", () => carregaMes(b.dataset.mes)));

function carregaMes(mmaaaa) {

        <div class="pbar"><div class="pbar-fill" style="width:${(r.lucro/mx*100).toFixed(1)}%;background:var(--yellow)"></div></div></div>`).join("");

// ── Helpers ──────────────────────────────────────────────────────────────────
function kpi(label,val,sub="",cls="") {
  return `<div class="kpi ${cls}"><div class="kpi-label">${label}</div>
    <div class="kpi-val">${val}</div>${sub?`<div class="kpi-sub">${sub}</div>`:""}</div>`;
}

function renderBars(id, dias, completo) {
  const wrap = document.getElementById(id);
  const mx = Math.max(...dias.map(d=>d.total), 1);
  const MAXPX = 140;  // altura util em px (bars=170, sobra p/ label)
  wrap.innerHTML = dias.map(d => {
    const hpx = d.total>0 ? Math.max(3, Math.round(d.total/mx*MAXPX)) : 0;
    const title = `Dia ${d.dia}: ${brl(d.total)}`;
    if (completo && (d.vista||d.prazo)) {
      const hvpx = Math.round(d.vista/mx*MAXPX);
      const hppx = Math.round(d.prazo/mx*MAXPX);
      return `<div class="bar-wrap" title="${title}">
        <div class="bar-stack" style="height:${hvpx+hppx}px">
          <div class="bar-prazo" style="height:${hppx}px"></div>
          <div class="bar-vista" style="height:${hvpx}px"></div>
        </div><div class="bar-label">${d.dia}</div></div>`;
    } else {
      return `<div class="bar-wrap" title="${title}">
        <div class="bar-stack" style="height:${hpx}px"><div class="bar-total" style="height:${hpx}px"></div></div>
        <div class="bar-label">${d.dia}</div></div>`;
    }
  }).join("");
}

function pizzaSVG(a,b) {
  const tot = a+b; if (!tot) return "";
  const ang = 2*Math.PI*(a/tot);
  const x1=50+46*Math.sin(0),y1=50-46*Math.cos(0);
  const x2=50+46*Math.sin(ang),y2=50-46*Math.cos(ang);
  const lg = ang>Math.PI?1:0;
  return `<svg width="100" height="100" viewBox="0 0 100 100">
    <path d="M50,50 L${x1},${y1} A46,46 0 ${lg},1 ${x2},${y2} Z" fill="var(--green)" opacity=".85"/>
    <path d="M50,50 L${x2},${y2} A46,46 0 ${1-lg},1 ${x1},${y1} Z" fill="var(--blue)" opacity=".85"/>
  </svg>
  <div class="legend">
    <div class="leg-item"><div class="leg-dot" style="background:var(--green)"></div>
      <div><b>À Vista</b><br><span style="color:var(--muted)">${brl(a)} (${pct(a,tot)})</span></div></div>
    <div class="leg-item"><div class="leg-dot" style="background:var(--blue)"></div>
      <div><b>À Prazo</b><br><span style="color:var(--muted)">${brl(b)} (${pct(b,tot)})</span></div></div>
  </div>`;
}

// ── Cadastro ─────────────────────────────────────────────────────────────────
function renderCadastro(d, nomeMes) {
  const cad = d.cadastro || [];
  document.getElementById("cad-titulo").textContent = `Ranking Cadastro (CPF) — ${nomeMes}`;
  if (!cad.length) {
    document.getElementById("tab-cad").innerHTML = "<tr><td colspan='6' style='color:var(--muted);padding:16px'>Dados de cadastro disponíveis apenas para meses com VendasDetalhadas.</td></tr>";
    document.getElementById("cad-bars").innerHTML = "";
    return;
  }
  const totalCad = cad.reduce((s,r)=>s+r.cad,0);
  const totalV   = cad.reduce((s,r)=>s+r.vendas,0);
  const pctGeral = totalV ? Math.round(100*totalCad/totalV) : 0;
  const cor = p => p>=40?"var(--green)":p>=20?"var(--yellow)":"var(--muted)";
  document.getElementById("tab-cad").innerHTML = `
    <tr><th>#</th><th>Vendedor</th><th class='num'>Vendas</th><th class='num'>C/ Cad.</th><th class='num'>%</th><th class='num'>Faturamento</th></tr>
    ${cad.map((r,i)=>`<tr>
      <td style='color:var(--muted);font-size:11px'>${i+1}</td>
      <td><b>${r.nome}</b></td>
      <td class='num'>${r.vendas}</td>
      <td class='num' style='color:var(--yellow)'><b>${r.cad}</b></td>
      <td class='num' style='color:${cor(r.pct)}'>${r.pct}%</td>
      <td class='num'>${brl(r.fat)}</td>
    </tr>`).join("")}
    <tr style='border-top:1px solid var(--line)'>
      <td></td><td style='color:var(--muted)'>Total</td>
      <td class='num'>${totalV}</td>
      <td class='num' style='color:var(--yellow)'><b>${totalCad}</b></td>
      <td class='num' style='color:var(--green)'><b>${pctGeral}%</b></td><td></td>
    </tr>`;
  const maxPct = Math.max(...cad.map(r=>r.pct), 1);
  document.getElementById("cad-bars").innerHTML = cad.map(r=>`
    <div class="pbar-wrap" style="margin-bottom:9px">
      <div class="pbar-label">
        <span><b>${r.nome}</b> <span style="color:var(--muted);font-size:10px">${r.cad} cads</span></span>
        <span style="color:${cor(r.pct)}">${r.pct}%</span>
      </div>
      <div class="pbar" style="height:16px"><div class="pbar-fill"
        style="width:${(r.pct/maxPct*100).toFixed(1)}%;background:${cor(r.pct)}"></div></div>
    </div>`).join("");
}

// ── Init ─────────────────────────────────────────────────────────────────────
const mesInicial = "072026";
setTab("geral");
carregaMes(mesInicial);
</script>
