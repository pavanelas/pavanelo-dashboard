<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pavanelo | Fecha-Mês Jun/2026</title>
  <style>
    :root {
      --bg:#061b0b; --card:rgba(18,56,25,.72); --line:rgba(118,197,138,.24);
      --text:#f4fff5; --muted:#a8c4b4; --green:#43e681; --yellow:#ffc928;
      --blue:#5aa2ff; --red:#ff6060; --shadow:0 18px 60px rgba(0,0,0,.28);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:radial-gradient(circle at 22% 12%,rgba(67,230,129,.12),transparent 34%),
          linear-gradient(135deg,var(--bg) 0%,#071506 52%,#09210e 100%);
          color:var(--text);font-family:Arial,Helvetica,sans-serif;min-height:100vh}
    header{padding:20px 24px 0;border-bottom:1px solid var(--line);
            background:rgba(6,27,11,.92)}
    .brand{color:var(--yellow);font-size:11px;font-weight:800;letter-spacing:3px;
            text-transform:uppercase;margin-bottom:6px}
    h1{font-size:clamp(22px,3vw,36px);line-height:1;margin-bottom:4px}
    .meta{color:var(--muted);font-size:12px;margin-bottom:14px}
    /* tabs */
    .tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:0}
    .tab{border:1px solid var(--line);background:rgba(18,56,25,.64);color:var(--muted);
          padding:9px 14px;border-radius:8px 8px 0 0;font-weight:800;cursor:pointer;
          font-size:13px;white-space:nowrap;border-bottom:none}
    .tab.active{color:#061b0b;background:var(--yellow);border-color:var(--yellow)}
    /* panels */
    .panel{display:none;padding:24px}
    .panel.active{display:block}
    /* kpi grid */
    .kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin-bottom:24px}
    .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
    .kpi-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
    .kpi-val{font-size:24px;font-weight:900;line-height:1}
    .kpi-sub{font-size:12px;color:var(--muted);margin-top:4px}
    .kpi.destaque .kpi-val{color:var(--yellow)}
    .kpi.verde .kpi-val{color:var(--green)}
    .kpi.azul .kpi-val{color:var(--blue)}
    .kpi.alerta .kpi-val{color:var(--red)}
    /* section cards */
    .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
    .card h3{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:14px}
    /* bar chart */
    .bars{display:flex;align-items:flex-end;gap:3px;height:160px;overflow-x:auto;padding-bottom:4px}
    .bar-wrap{display:flex;flex-direction:column;align-items:center;min-width:24px;flex:1}
    .bar-stack{display:flex;flex-direction:column;justify-content:flex-end;width:100%;border-radius:3px 3px 0 0;overflow:hidden}
    .bar-prazo{background:var(--blue);opacity:.85}
    .bar-vista{background:var(--green);opacity:.85}
    .bar-label{font-size:9px;color:var(--muted);margin-top:3px}
    /* table */
    table{width:100%;border-collapse:collapse;font-size:13px}
    th{color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);font-size:11px;text-transform:uppercase}
    td{padding:7px 8px;border-bottom:1px solid rgba(118,197,138,.1)}
    tr:hover td{background:rgba(67,230,129,.05)}
    .num{text-align:right;font-variant-numeric:tabular-nums}
    /* pizza */
    .pizza-row{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
    .legend{display:flex;flex-direction:column;gap:10px}
    .leg-item{display:flex;align-items:center;gap:8px;font-size:13px}
    .leg-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
    /* progress */
    .pbar-wrap{margin-bottom:8px}
    .pbar-label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px}
    .pbar{height:14px;background:rgba(118,197,138,.15);border-radius:7px;overflow:hidden}
    .pbar-fill{height:100%;border-radius:7px;transition:width .4s}
    /* fake badge */
    .fake-badge{background:rgba(255,96,96,.18);border:1px solid rgba(255,96,96,.4);
                 color:var(--red);border-radius:8px;padding:10px 16px;font-size:12px;margin-bottom:16px}
    @media(max-width:600px){.kpis{grid-template-columns:repeat(2,1fr)}.bars{height:110px}}
  </style>
</head>

// ── Pizza SVG ────────────────────────────────────────────────────────────────
function pizzaSVG(a, b) {
  const tot = a + b;
  const ang = 2*Math.PI*(a/tot);
  const x1=50+46*Math.sin(0), y1=50-46*Math.cos(0);
  const x2=50+46*Math.sin(ang), y2=50-46*Math.cos(ang);
  const lg = ang > Math.PI ? 1 : 0;
  return `<div class="pizza-row">
    <svg width="110" height="110" viewBox="0 0 100 100">
      <path d="M50,50 L${x1},${y1} A46,46 0 ${lg},1 ${x2},${y2} Z" fill="var(--green)" opacity=".85"/>
      <path d="M50,50 L${x2},${y2} A46,46 0 ${1-lg},1 ${x1},${y1} Z" fill="var(--blue)" opacity=".85"/>
    </svg>
    <div class="legend">
      <div class="leg-item"><div class="leg-dot" style="background:var(--green)"></div>
        <div><b>À Vista</b><br><span style="color:var(--muted)">${brl(a)} (${pct(a,tot)})</span></div></div>
      <div class="leg-item"><div class="leg-dot" style="background:var(--blue)"></div>
        <div><b>À Prazo</b><br><span style="color:var(--muted)">${brl(b)} (${pct(b,tot)})</span></div></div>
    </div>
  </div>`;
}

// ── Evolução Diária ───────────────────────────────────────────────────────────
function renderBars(containerId, dias, maxVal) {
  const wrap = document.getElementById(containerId);
  const mx = maxVal || Math.max(...dias.map(d=>d.total));
  wrap.innerHTML = dias.map(d => {
    const h = d.total > 0 ? Math.max(4, Math.round(d.vista/mx*100)) : 0;
    const hp = d.total > 0 ? Math.max(4, Math.round(d.prazo/mx*100)) : 0;
    return `<div class="bar-wrap">
      <div class="bar-stack" style="height:${h+hp}%">
        <div class="bar-prazo" style="height:${hp/(h+hp)*100||0}%"></div>
        <div class="bar-vista" style="height:${h/(h+hp)*100||0}%"></div>
      </div>
      <div class="bar-label">${d.dia}</div>
    </div>`;
  }).join("");
}

if (FAKE_TOT > 0) {

    `<div class="fake-badge">⚠ Vendedor 80 (acerto contábil/FAKE) — ${brl(FAKE_TOT)} excluído dos totais abaixo.</div>`;
}

const maxV = VENDEDORES[0]?.tot || 1;
document.getElementById("vend-bars").innerHTML = VENDEDORES.map(v=>`
  <div class="pbar-wrap" style="margin-bottom:10px">
    <div class="pbar-label"><span><b>${v.nome}</b></span><span>${brl(v.tot)}</span></div>
    <div class="pbar" style="height:18px"><div class="pbar-fill" style="width:${(v.tot/maxV*100).toFixed(1)}%;background:var(--yellow)"></div></div>
  </div>`).join("");

const totReal = VENDEDORES.reduce((s,v)=>s+v.tot,0);
document.getElementById("tab-vend").innerHTML = `
  <tr><th>Vendedor</th><th class="num">Total</th><th class="num">À Vista</th><th class="num">À Prazo</th><th class="num">% Fat.</th></tr>
  ${VENDEDORES.map(v=>`<tr>
    <td><b>${v.nome}</b></td>
    <td class="num" style="color:var(--yellow)">${brl(v.tot)}</td>
    <td class="num" style="color:var(--green)">${brl(v.vista)}</td>
    <td class="num" style="color:var(--blue)">${brl(v.prazo)}</td>
    <td class="num">${pct(v.tot,totReal)}</td>
  </tr>`).join("")}`;
</script>
</body>
</html>
