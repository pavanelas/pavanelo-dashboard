<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pavanelo | Central de Dashboards</title>
  <style>
    :root {
      --bg: #061b0b;
      --card: rgba(18, 56, 25, .72);
      --line: rgba(118, 197, 138, .24);
      --text: #f4fff5;
      --muted: #a8c4b4;
      --green: #43e681;
      --yellow: #ffc928;
      --blue: #5aa2ff;
      --shadow: 0 18px 60px rgba(0, 0, 0, .28);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background:
        radial-gradient(circle at 22% 12%, rgba(67, 230, 129, .12), transparent 34%),
        linear-gradient(135deg, var(--bg) 0%, #071506 52%, #09210e 100%);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      letter-spacing: 0;
      overflow: hidden;
    }
    body::-webkit-scrollbar, .tabs::-webkit-scrollbar { height: 8px; width: 8px; }
    body::-webkit-scrollbar-track, .tabs::-webkit-scrollbar-track { background: #061207; }
    body::-webkit-scrollbar-thumb, .tabs::-webkit-scrollbar-thumb {
      background: rgba(255, 201, 40, .55);
      border-radius: 999px;
    }
    .app { display: grid; grid-template-rows: auto 1fr; min-height: 100%; }
    header {
      padding: 22px 26px 16px;
      border-bottom: 1px solid var(--line);
      background: rgba(6, 27, 11, .92);
      box-shadow: var(--shadow);
      position: relative;
      z-index: 2;
    }
    .top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
      max-width: 1500px;
      margin: 0 auto 18px;
    }
    .brand {
      color: var(--yellow);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    h1 { margin: 0; font-size: clamp(24px, 3vw, 42px); line-height: 1; }
    .meta { color: var(--muted); font-size: 13px; line-height: 1.5; text-align: right; white-space: nowrap; }
    .tabs { display: flex; gap: 10px; max-width: 1500px; margin: 0 auto; overflow-x: auto; padding-bottom: 4px; }
    .tab {
      border: 1px solid var(--line);
      background: rgba(18, 56, 25, .64);
      color: var(--muted);
      padding: 10px 14px;
      border-radius: 8px;
      font-weight: 800;
      cursor: pointer;
      min-width: max-content;
    }
    .tab.active { color: #061b0b; background: var(--yellow); border-color: var(--yellow); }
    main { display: block; min-height: 0; }
    .viewer { min-height: 0; background: #061207; position: relative; }
    .viewer-bar {
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 0 16px;
      border-bottom: 1px solid var(--line);
      background: rgba(8, 28, 11, .84);
      color: var(--muted);
      font-size: 13px;
    }
    .viewer-title { color: var(--text); font-weight: 900; }
    .open-link { color: var(--yellow); text-decoration: none; font-weight: 800; white-space: nowrap; }
    iframe { display: block; width: 100%; height: calc(100vh - 155px); border: 0; background: #061207; }
    @media (max-width: 900px) {
      body { overflow: auto; }
      .top { display: block; }
      .meta { text-align: left; margin-top: 10px; white-space: normal; }
      iframe { height: 72vh; }
    }
    @media (max-width: 560px) {
      header { padding: 18px 14px 12px; }
      .viewer-bar { align-items: flex-start; height: auto; padding: 12px 14px; flex-direction: column; }
      iframe { height: 76vh; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="top">
        <div>
          <div class="brand">Pavanelo Agrocomercial</div>
          <h1>Central de Dashboards</h1>
        </div>
        <div class="meta">Atualizado em 08/06/2026 17:40<br>Um link para todos os setores</div>
      </div>
      <nav class="tabs" aria-label="Dashboards"><button class="tab active" data-url="dashboard_mobile.html" data-title="Comercial" aria-selected="true">Comercial</button><button class="tab" data-url="cozinha.html" data-title="Cozinha / Tablet" aria-selected="false">Cozinha / Tablet</button><button class="tab" data-url="executivo.html" data-title="Executivo" aria-selected="false">Executivo</button><button class="tab" data-url="compras.html" data-title="Compras / ABC" aria-selected="false">Compras / ABC</button><button class="tab" data-url="relatorio_mensal.html" data-title="Relatorio Mensal" aria-selected="false">Relatorio Mensal</button><button class="tab" data-url="crm.html" data-title="CRM" aria-selected="false">CRM</button></nav>
    </header>
    <main>
      <section class="viewer">
        <div class="viewer-bar">
          <div><span class="viewer-title" id="viewerTitle">Comercial</span> <span id="viewerUrl">dashboard_mobile.html</span></div>
          <a class="open-link" id="openLink" href="dashboard_mobile.html" target="_blank">Abrir em tela cheia</a>
        </div>
        <iframe id="dashboardFrame" name="dashboardFrame" src="dashboard_mobile.html?v=20260608174051" title="Dashboard Pavanelo"></iframe>
      </section>
    </main>
  </div>
  <script>
    const frame = document.getElementById('dashboardFrame');
    const title = document.getElementById('viewerTitle');
    const urlText = document.getElementById('viewerUrl');
    const openLink = document.getElementById('openLink');
    const tabs = Array.from(document.querySelectorAll('.tab'));
    const cacheId = '20260608174051';
    function comCache(url) {
      const sep = url.includes('?') ? '&' : '?';
      return `${url}${sep}v=${cacheId}`;
    }
    function abrirDashboard(url, nome) {
      frame.src = comCache(url);
      title.textContent = nome;
      urlText.textContent = url;
      openLink.href = comCache(url);
      tabs.forEach(t => {
        const ativo = t.dataset.url === url;
        t.classList.toggle('active', ativo);
        t.setAttribute('aria-selected', ativo ? 'true' : 'false');
      });
    }
    tabs.forEach(tab => tab.addEventListener('click', () => abrirDashboard(tab.dataset.url, tab.dataset.title)));
  </script>
</body>
</html>
